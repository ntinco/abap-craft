name: health-check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/health_check.py --strict
      # The validator ai/repo-map.json declares: a pull request that breaks the site fails here, not after the merge.
      - run: sh tools/jekyll_build.sh
